<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#2ee6a8"/>
      <stop offset="100%" stop-color="#39c2ff"/>
      <animate attributeName="x1" values="0%;30%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;130%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#39c2ff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#2ee6a8" stop-opacity=".5"/>
    </linearGradient>
    <radialGradient id="glowG" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22c55e" stop-opacity=".38"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ef4444" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <style>
      .drawcheck { stroke-dasharray: 130; stroke-dashoffset: 130; animation: draw 3.6s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 130; } 45% { stroke-dashoffset: 0; } 80% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 130; } }
      .spinring { transform-origin: 175px 150px; animation: spin 14s linear infinite; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
  </defs>

  <rect width="1200" height="340" fill="#0a1120"/>
  <circle cx="180" cy="150" r="200" fill="url(#glowG)"/>
  <circle cx="1060" cy="52" r="150" fill="url(#glowR)" opacity=".7"/>

  <!-- floating particles -->
  <g fill="#7ef0b2">
    <circle cx="430" cy="64" r="3"><animate attributeName="cy" values="64;46;64" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;.3;.9" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="655" cy="42" r="2.4"><animate attributeName="cy" values="42;60;42" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;.95;.4" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="905" cy="86" r="3"><animate attributeName="cy" values="86;68;86" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;.35;.8" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="1105" cy="150" r="2.2" fill="#fca5a5"><animate attributeName="cy" values="150;132;150" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;1;.5" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="118" r="2"><animate attributeName="cy" values="118;102;118" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;.3;.7" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="128" r="2.6" fill="#93d8ff"><animate attributeName="cy" values="128;144;128" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;.9;.35" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="985" cy="215" r="2.2"><animate attributeName="cy" values="215;198;215" dur="5.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;.25;.6" dur="5.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- animated waves -->
  <g>
    <path d="M-200 285 Q 100 245 400 285 T 1000 285 T 1600 285 V 340 H -200 Z" fill="url(#wave1)" opacity=".5">
      <animateTransform attributeName="transform" type="translate" values="0 0; -300 0; 0 0" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M-200 305 Q 150 272 500 305 T 1200 305 T 1900 305 V 340 H -200 Z" fill="url(#wave1)" opacity=".85">
      <animateTransform attributeName="transform" type="translate" values="-300 0; 0 0; -300 0" dur="14s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- dashed verdict ring -->
  <circle class="spinring" cx="175" cy="150" r="118" fill="none" stroke="#2ee6a8" stroke-opacity=".45" stroke-width="2.5" stroke-dasharray="10 14"/>

  <!-- shield with animated checkmark -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="4.2s" repeatCount="indefinite"/>
    <path d="M175 48 L248 76 V142 C248 200 218 232 175 254 C132 232 102 200 102 142 V76 Z" fill="#0f2318" stroke="url(#grad)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M175 66 L232 88 V142 C232 189 209 215 175 233 C141 215 118 189 118 142 V88 Z" fill="#22c55e" opacity=".14"/>
    <polyline class="drawcheck" points="138,148 166,178 216,118" fill="none" stroke="#2ee6a8" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- small FAIL x badge, pulsing -->
  <g transform="translate(268,196)">
    <circle r="21" fill="#2a0f12" stroke="#ef4444" stroke-width="2.5"/>
    <path d="M-7 -7 L7 7 M7 -7 L-7 7" stroke="#f87171" stroke-width="4.5" stroke-linecap="round"/>
    <animate attributeName="opacity" values="1;.45;1" dur="2.2s" repeatCount="indefinite"/>
  </g>
  <!-- small PASS check badge, pulsing offset -->
  <g transform="translate(84,84)">
    <circle r="17" fill="#0f2318" stroke="#22c55e" stroke-width="2.5"/>
    <path d="M-7 0 L-2 6 L8 -6" fill="none" stroke="#2ee6a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <animate attributeName="opacity" values=".45;1;.45" dur="2.2s" repeatCount="indefinite"/>
  </g>

  <!-- title -->
  <text x="330" y="146" font-family="'Segoe UI', system-ui, sans-serif" font-size="88" font-weight="800" fill="url(#grad)" letter-spacing="1">proof-cli</text>
  <text x="334" y="194" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" fill="#d9fbe9">Make AI agents prove their work —</text>
  <text x="334" y="228" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" fill="#d9fbe9">before they say &#8220;done&#8221;.</text>

  <!-- chips -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="17" fill="#eafff3">
    <g transform="translate(334,252)">
      <rect width="172" height="36" rx="18" fill="#0f2318" stroke="#22c55e" stroke-opacity=".7"/>
      <path d="M16 18 l6 6 l11 -12" fill="none" stroke="#2ee6a8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="42" y="24">PASS = exit 0</text>
    </g>
    <g transform="translate(522,252)">
      <rect width="164" height="36" rx="18" fill="#2a0f12" stroke="#ef4444" stroke-opacity=".7"/>
      <path d="M18 12 l12 12 M30 12 l-12 12" stroke="#f87171" stroke-width="3.4" stroke-linecap="round"/>
      <text x="42" y="24">FAIL = exit 1</text>
    </g>
    <g transform="translate(702,252)">
      <rect width="196" height="36" rx="18" fill="#0f1f38" stroke="#39c2ff" stroke-opacity=".6"/>
      <circle cx="24" cy="18" r="5" fill="#39c2ff"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="40" y="24">Zero dependencies</text>
    </g>
    <g transform="translate(914,252)">
      <rect width="150" height="36" rx="18" fill="#0f1f38" stroke="#2ee6a8" stroke-opacity=".6"/>
      <circle cx="24" cy="18" r="5" fill="#2ee6a8"><animate attributeName="opacity" values=".25;1;.25" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></circle>
      <text x="40" y="24">MCP ready</text>
    </g>
  </g>
</svg>
