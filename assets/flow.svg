<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="272" viewBox="0 0 1040 272">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset=".55" stop-color="#2ee6a8"/>
      <stop offset="1" stop-color="#39c2ff"/>
    </linearGradient>
  </defs>
  <rect width="1040" height="272" rx="16" fill="#0a1120"/>

  <!-- connectors -->
  <g stroke="#2b4a3a" stroke-width="3">
    <line x1="232" y1="105" x2="288" y2="105"/>
    <line x1="502" y1="105" x2="558" y2="105"/>
    <line x1="772" y1="105" x2="828" y2="105"/>
  </g>
  <!-- arrowheads -->
  <g fill="#2ee6a8">
    <polygon points="288,105 276,99 276,111"/>
    <polygon points="558,105 546,99 546,111"/>
    <polygon points="828,105 816,99 816,111"/>
  </g>
  <!-- travelling pulses -->
  <circle r="6" fill="#22c55e">
    <animateMotion path="M232 105 H288" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#2ee6a8">
    <animateMotion path="M502 105 H558" dur="1.6s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.6s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#39c2ff">
    <animateMotion path="M772 105 H828" dur="1.6s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.6s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <g font-family="'Segoe UI', system-ui, sans-serif">
    <!-- 1 DETECT -->
    <g>
      <rect x="22" y="50" width="210" height="110" rx="14" fill="#0d1f2a" stroke="#22c55e" stroke-opacity=".65" stroke-width="1.6"/>
      <g transform="translate(112,68)">
        <circle cx="0" cy="0" r="13" fill="none" stroke="#22c55e" stroke-width="3.4"/>
        <line x1="10" y1="10" x2="21" y2="21" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="translate" values="112 68; 122 68; 112 68" dur="3s" repeatCount="indefinite" additive="replace"/>
      </g>
      <text x="127" y="126" text-anchor="middle" font-size="19" font-weight="700" fill="#eafff3">1 · DETECT</text>
      <text x="127" y="186" text-anchor="middle" font-size="14.5" fill="#93b8a5">what kind of project is it?</text>
      <text x="127" y="206" text-anchor="middle" font-size="14.5" fill="#93b8a5">package.json · pytest · index.html</text>
    </g>
    <!-- 2 RUN CHECKS -->
    <g>
      <rect x="292" y="50" width="210" height="110" rx="14" fill="#0d1f2a" stroke="#2ee6a8" stroke-opacity=".65" stroke-width="1.6"/>
      <g stroke="#2ee6a8" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M352 74 l6 6 l11 -12"><animate attributeName="stroke-opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></path>
        <line x1="378" y1="72" x2="428" y2="72" stroke="#5b7a68"/>
        <path d="M352 96 l6 6 l11 -12"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="2.4s" repeatCount="indefinite"/></path>
        <line x1="378" y1="94" x2="428" y2="94" stroke="#5b7a68"/>
      </g>
      <text x="397" y="126" text-anchor="middle" font-size="19" font-weight="700" fill="#eafff3">2 · RUN CHECKS</text>
      <text x="397" y="186" text-anchor="middle" font-size="14.5" fill="#93b8a5">only the checks that exist</text>
      <text x="397" y="206" text-anchor="middle" font-size="14.5" fill="#93b8a5">build · lint · typecheck · test</text>
    </g>
    <!-- 3 WEB CHECK -->
    <g>
      <rect x="562" y="50" width="210" height="110" rx="14" fill="#0d1f2a" stroke="#39c2ff" stroke-opacity=".65" stroke-width="1.6"/>
      <g transform="translate(667,84)">
        <path d="M-26 0 C-14 -17 14 -17 26 0 C14 17 -14 17 -26 0 Z" fill="none" stroke="#39c2ff" stroke-width="3"/>
        <circle r="8" fill="none" stroke="#39c2ff" stroke-width="3">
          <animate attributeName="r" values="6.5;9.5;6.5" dur="2.8s" repeatCount="indefinite"/>
        </circle>
        <circle r="2.6" fill="#39c2ff"/>
      </g>
      <text x="667" y="126" text-anchor="middle" font-size="19" font-weight="700" fill="#eafff3">3 · WEB CHECK</text>
      <text x="667" y="186" text-anchor="middle" font-size="14.5" fill="#93b8a5">white screen = FAIL</text>
      <text x="667" y="206" text-anchor="middle" font-size="14.5" fill="#93b8a5">screenshots when Playwright exists</text>
    </g>
    <!-- 4 REPORT -->
    <g>
      <rect x="832" y="50" width="186" height="110" rx="14" fill="#0d1f2a" stroke="#22c55e" stroke-opacity=".8" stroke-width="1.6"/>
      <g transform="translate(898,64)">
        <rect x="0" y="0" width="40" height="32" rx="4" fill="none" stroke="#eafff3" stroke-width="2.6"/>
        <line x1="7" y1="11" x2="33" y2="11" stroke="#5b7a68" stroke-width="2.6"/>
        <line x1="7" y1="19" x2="26" y2="19" stroke="#5b7a68" stroke-width="2.6"/>
        <g transform="rotate(-14 52 26)">
          <rect x="34" y="14" width="46" height="20" rx="4" fill="none" stroke="#22c55e" stroke-width="2.6"/>
          <text x="57" y="29" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#22c55e">PASS</text>
          <animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/>
        </g>
      </g>
      <text x="925" y="126" text-anchor="middle" font-size="19" font-weight="700" fill="#eafff3">4 · REPORT</text>
      <text x="925" y="186" text-anchor="middle" font-size="14.5" fill="#93b8a5">proof-report.md</text>
      <text x="925" y="206" text-anchor="middle" font-size="14.5" fill="#93b8a5">PASS / FAIL · fix-first list</text>
    </g>
  </g>

  <text x="520" y="242" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#5f7d6d">Missing checks are SKIP, never FAIL · Nothing ran = FAIL, not a free pass</text>
  <rect x="22" y="256" width="996" height="3" rx="1.5" fill="url(#fg)" opacity=".5">
    <animate attributeName="opacity" values=".25;.65;.25" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
