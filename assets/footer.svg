<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190">
  <defs>
    <linearGradient id="fgrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#2ee6a8"/>
      <stop offset="100%" stop-color="#39c2ff"/>
      <animate attributeName="x1" values="0%;25%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;125%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fwave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#39c2ff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#2ee6a8" stop-opacity=".5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="190" fill="#0a1120"/>
  <path d="M-200 26 Q 100 56 400 26 T 1000 26 T 1600 26 V 0 H -200 Z" fill="url(#fwave)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -300 0; 0 0" dur="11s" repeatCount="indefinite"/>
  </path>
  <path d="M-200 44 Q 150 70 500 44 T 1200 44 T 1900 44 V 0 H -200 Z" fill="url(#fwave)" opacity=".45">
    <animateTransform attributeName="transform" type="translate" values="-300 0; 0 0; -300 0" dur="13s" repeatCount="indefinite"/>
  </path>

  <!-- shield mini -->
  <g transform="translate(600,62)">
    <path d="M0 -22 L20 -14 V6 C20 20 12 28 0 34 C-12 28 -20 20 -20 6 V-14 Z" fill="none" stroke="url(#fgrad)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-9 2 L-3 9 L11 -7" fill="none" stroke="#2ee6a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" values="1;.4;1" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="600" y="128" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="800" fill="url(#fgrad)">proof-cli</text>
  <rect x="470" y="140" width="260" height="3.5" rx="1.75" fill="url(#fgrad)">
    <animate attributeName="opacity" values=".45;1;.45" dur="3.6s" repeatCount="indefinite"/>
  </rect>

  <!-- verdict pills -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="14.5" font-weight="700">
    <g transform="translate(432,152)">
      <rect width="150" height="26" rx="13" fill="#0f2318" stroke="#22c55e" stroke-opacity=".7"/>
      <text x="75" y="18" text-anchor="middle" fill="#2ee6a8">PASS · exit 0</text>
      <animate attributeName="opacity" values="1;.4;1" dur="2.4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(618,152)">
      <rect width="150" height="26" rx="13" fill="#2a0f12" stroke="#ef4444" stroke-opacity=".7"/>
      <text x="75" y="18" text-anchor="middle" fill="#f87171">FAIL · exit 1</text>
      <animate attributeName="opacity" values=".4;1;.4" dur="2.4s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
