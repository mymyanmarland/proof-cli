<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset=".55" stop-color="#2ee6a8"/>
      <stop offset="1" stop-color="#39c2ff"/>
    </linearGradient>
  </defs>
  <path d="M-200 38 Q 100 14 400 38 T 1000 38 T 1600 38" fill="none" stroke="url(#dg)" stroke-width="3" stroke-linecap="round" opacity=".85">
    <animateTransform attributeName="transform" type="translate" values="0 0; -300 0; 0 0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M-200 48 Q 150 28 500 48 T 1200 48 T 1900 48" fill="none" stroke="url(#dg)" stroke-width="2" stroke-linecap="round" opacity=".35">
    <animateTransform attributeName="transform" type="translate" values="-300 0; 0 0; -300 0" dur="12s" repeatCount="indefinite"/>
  </path>
  <!-- travelling spark -->
  <circle r="4" fill="#2ee6a8">
    <animateMotion path="M40 32 H1160" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <!-- center shield-check -->
  <g transform="translate(600,32)">
    <path d="M0 -15 L13 -10 V2 C13 10 8 15 0 19 C-8 15 -13 10 -13 2 V-10 Z" fill="#0a1120" stroke="#2ee6a8" stroke-width="2"/>
    <path d="M-6 1 L-2 5 L7 -5" fill="none" stroke="#2ee6a8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <animate attributeName="opacity" values="1;.45;1" dur="2.4s" repeatCount="indefinite"/>
  </g>
</svg>
