<svg xmlns="http://www.w3.org/2000/svg" width="920" height="54" viewBox="0 0 920 54">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset=".55" stop-color="#2ee6a8"/>
      <stop offset="1" stop-color="#39c2ff"/>
    </linearGradient>
  </defs>
  <text x="4" y="37" font-family="Consolas, 'SF Mono', monospace" font-size="26" fill="#64748b">$</text>
  <g font-family="Consolas, 'SF Mono', monospace" font-size="26" font-weight="700" fill="url(#tg)">
    <text x="36" y="37" opacity="0">Agents say done. Proof makes them prove it.
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.34;1" dur="10.5s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="37" opacity="0">Broken build? White screen? Caught &#8212; FAIL.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.40;0.63;0.67;1" dur="10.5s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="37" opacity="0">One report. PASS or FAIL. No guessing.
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.69;0.73;0.96;1" dur="10.5s" repeatCount="indefinite"/>
    </text>
  </g>
  <rect x="892" y="14" width="13" height="28" fill="#2ee6a8">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
